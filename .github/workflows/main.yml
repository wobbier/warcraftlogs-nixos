name: Update Warcraft Logs

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27

      - name: Install nix-update
        run: nix profile install github:Mic92/nix-update

      - name: Update warcraftlogs package
        run: |
          nix-update pkgs/warcraftlogs/default.nix \
            --version-regex '([0-9]+\.[0-9]+\.[0-9]+)' \
            --build

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'version =' pkgs/warcraftlogs/default.nix | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add pkgs/warcraftlogs/default.nix

          git diff --cached --quiet || git commit -m "⚔️ warcraftlogs: update to ${{ steps.version.outputs.version }}"
          git push
